name: CI

# One workflow carries both matrices so that every check keeps its job id, name
# and steps:
#
#   pull_request, push   lint-and-abi, build (Linux shared and static, Apple
#                        Silicon) and the native Windows x64 MSVC build.
#   schedule             AlmaLinux 10 and the Linux MinGW cross compile only.
#   workflow_dispatch    The same compatibility pair, on demand.
#
# The compatibility environments report release portability rather than
# per-commit risk, so they run daily instead of on every pull request.
#
# The routine native jobs configure, build and test from the ci-* presets in
# CMakePresets.json so local and CI inputs stay aligned. The compatibility
# jobs keep their own commands because their container and cross toolchains do
# not share that configuration.
on:
  push:
    branches: [main]
    # Docs and repository metadata do not affect the native, ABI, lint or
    # fixture checks. The documentation workflow owns docs inputs.
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'Doxyfile'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [main]
    # Keep the same ignored paths for pull requests so a docs-only change does
    # not spend the native build matrix.
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'Doxyfile'
      - '.github/workflows/docs.yml'
  # GitHub schedules only the default branch, so this cron covers main between
  # pushes. 03:17 UTC is a minute off the top of the hour, where the documented
  # scheduling spike is, and outside the maintainers' working hours.
  schedule:
    - cron: '17 3 * * *'
  # EXPERIMENT BRANCH ONLY (C #198 sccache): the dispatch selects which half of
  # the comparison to run. The product workflow keeps this trigger input-free.
  workflow_dispatch:
    inputs:
      phase:
        description: sccache comparison phase
        required: true
        type: choice
        options:
          - seed
          - warm
        default: seed
      arm:
        description: which comparison arm to run
        required: true
        type: choice
        options:
          - both
          - candidate
        default: both

permissions:
  contents: read

# Rust builds are managed by rustup and rust-toolchain.toml. Keep incremental
# compilation off so the CI Rust caches stay small and reusable.
env:
  CARGO_INCREMENTAL: 0

concurrency:
  # A pull request keeps one group per ref, so a new push cancels the previous
  # run. Every other event gets its own run-id group, so a push, schedule or
  # dispatch run never cancels or displaces another run.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-and-abi:
    name: Lint and ABI checks
    # The diff-scoped C and C++ format check needs a base commit: a pull request
    # carries a base SHA and a push carries a before SHA. Schedule and dispatch
    # runs have neither, so they skip lint instead of failing on an unsupported
    # event.
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    # The first run builds the dev-profile Clippy cache from scratch; later runs
    # take a few minutes. Keep the ceiling above a cold dependency build.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust from rust-toolchain.toml
        run: rustup toolchain install

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ runner.os }}-lint
          cache-on-failure: true

      - name: Install pinned cbindgen
        run: |
          curl --proto '=https' --proto-redir '=https' --tlsv1.2 --retry 3 \
            --fail --location --silent --show-error \
            --output cbindgen \
            https://github.com/mozilla/cbindgen/releases/download/0.29.4/cbindgen-ubuntu22.04
          echo "27ac237e2ad3ffaffc8ecce0c03e3caa1d1b09e691906c3cb0967367ff6d783d  cbindgen" | sha256sum --check --strict
          chmod +x cbindgen
          sudo install -m 0755 cbindgen /usr/local/bin/cbindgen
          rm -f cbindgen
          cbindgen --version

      - name: Install clang and clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang clang-format

      - name: Run packaging fixture checks
        run: python3 .github/scripts/test_package.py

      - name: Run release fixture checks
        run: python3 .github/scripts/test_release.py

      - name: Check Rust formatting
        run: cargo fmt --check

      - name: Check formatting of changed C and C++ files
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          case "${EVENT_NAME}" in
            pull_request) base="${PR_BASE_SHA}" ;;
            push) base="${PUSH_BEFORE_SHA}" ;;
            *)
              echo "::error::unsupported event ${EVENT_NAME} for the diff-scoped format check"
              exit 1
              ;;
          esac
          clang-format --version
          python3 .github/scripts/check_format.py --repo . --base "${base}"

      - name: Check C ABI declarations (host and MSVC LLP64)
        run: |
          python3 .github/scripts/check_abi.py --repo . --self-test
          python3 .github/scripts/check_abi.py --repo . --target x86_64-pc-windows-msvc --self-test

      - name: Check Rust lints
        run: cargo clippy --all-targets -- -D warnings

  build:
    name: Build ${{ matrix.lib_type }} on ${{ matrix.os }}
    # Part of the change-triggered matrix; the daily run is compatibility-only.
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    # The cold macOS job took 69 minutes before the sanitizer lane was added;
    # keep room for a cold cache and runner variability.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            lib_type: shared
            preset: ci-linux-shared
          - os: ubuntu-latest
            lib_type: static
            preset: ci-linux-static
          - os: macos-15
            lib_type: shared
            preset: ci-macos

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust from rust-toolchain.toml
        run: rustup toolchain install

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}-${{ matrix.lib_type }}

      - name: Install dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y lsb-release valgrind
          wget https://apache.jfrog.io/artifactory/arrow/$(lsb_release --id --short | tr 'A-Z' 'a-z')/apache-arrow-apt-source-latest-$(lsb_release --codename --short).deb
          sudo apt-get install -y ./apache-arrow-apt-source-latest-$(lsb_release --codename --short).deb
          sudo apt-get update
          sudo apt-get install -y libarrow-dev libboost-coroutine-dev libboost-context-dev

      - name: Install dependencies (macOS)
        if: matrix.os == 'macos-15'
        run: |
          brew install apache-arrow protobuf boost

      # CI-only: CMake >= 3.24 promotes the project's C++ -Wall -Wextra
      # -Wtype-limits (or /W4) diagnostics to -Werror (/WX). C17 targets
      # keep their own strict flags. The project and local presets keep 3.22.
      - name: Configure CMake
        run: cmake --preset "${{ matrix.preset }}" -DCMAKE_COMPILE_WARNING_AS_ERROR=ON

      # The static leg's install and C17 checks need the final library. Running
      # them before the full build keeps check-install from switching the Cargo
      # unit back after the provider edge, which would compile lancedb-c a third
      # time on a warm cache. The staged library, C17 consumer and CTest roster
      # are unchanged; only the order inside the job changes.
      - name: Check installed package consumers (static, before build)
        if: matrix.lib_type == 'static'
        run: cmake --build --preset "${{ matrix.preset }}" --target check-install

      - name: Check C17 consumer (static, before build)
        if: matrix.lib_type == 'static'
        run: cmake --build --preset "${{ matrix.preset }}" --target check-c17

      - name: Build
        run: cmake --build --preset "${{ matrix.preset }}"

      - name: Check installed package consumers
        if: matrix.lib_type == 'shared'
        run: cmake --build --preset "${{ matrix.preset }}" --target check-install

      - name: Check C17 consumer
        if: matrix.lib_type == 'shared'
        run: cmake --build --preset "${{ matrix.preset }}" --target check-c17

      - name: Test
        run: ctest --preset "${{ matrix.preset }}" -j

      - name: Install Clang sanitizer toolchain
        if: matrix.os == 'ubuntu-latest' && matrix.lib_type == 'shared'
        run: |
          sudo apt-get install -y clang llvm
          clang --version
          llvm-symbolizer --version

      - name: Configure sanitizer build
        if: matrix.os == 'ubuntu-latest' && matrix.lib_type == 'shared'
        run: |
          cmake -S . -B build-sanitize -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=undefined" \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=undefined" \
            -DBUILD_SHARED_LIBS=ON \
            -DBUILD_TESTS=ON \
            -DBUILD_CONSUMER_TEST=ON \
            -DVALGRIND_EXECUTABLE=OFF \
            -DLANCEDB_CARGO_TARGET_DIR="${{ github.workspace }}/target"

      - name: Build sanitizer consumers
        if: matrix.os == 'ubuntu-latest' && matrix.lib_type == 'shared'
        run: cmake --build build-sanitize --verbose

      - name: Show sanitizer test roster
        if: matrix.os == 'ubuntu-latest' && matrix.lib_type == 'shared'
        run: ctest --test-dir build-sanitize -N -V

      - name: Run sanitizer tests
        if: matrix.os == 'ubuntu-latest' && matrix.lib_type == 'shared'
        env:
          UBSAN_OPTIONS: print_stacktrace=1
        run: ctest --test-dir build-sanitize --output-on-failure --no-tests=error

      - name: Show test diagnostics
        if: failure()
        run: |
          for log in build/Testing/Temporary/LastTest.log \
                     build-sanitize/Testing/Temporary/LastTest.log; do
            if [ -f "$log" ]; then
              echo "::group::$log"
              cat "$log"
              echo "::endgroup::"
            fi
          done
          for log in build/valgrind_*.txt; do
            [ -e "$log" ] || continue
            echo "::group::$log"
            cat "$log"
            echo "::endgroup::"
          done

      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-diagnostics-${{ matrix.os }}-${{ matrix.lib_type }}
          path: |
            build/Testing/Temporary/LastTest.log
            build-sanitize/Testing/Temporary/LastTest.log
            build/valgrind_*.txt
          if-no-files-found: ignore
          retention-days: 7

  build_windows_native:
    name: Build shared on windows-2025
    # Part of the change-triggered matrix; the daily run is compatibility-only.
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: windows-2025
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Enable long paths for Cargo git checkouts
        shell: pwsh
        run: git config --global core.longpaths true

      # The locked Lance v15.1.0-beta.2 fixture contains a 188-character
      # relative test-data path. C:\c keeps Cargo's git checkout under MAX_PATH.
      - name: Use short Cargo home on Windows
        shell: bash
        run: |
          mkdir -p /c/c
          echo 'CARGO_HOME=C:\c' >> "$GITHUB_ENV"

      - name: Install Rust from rust-toolchain.toml
        run: rustup toolchain install

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install protoc
        shell: pwsh
        run: |
          choco install protoc --version=29.0.0 -y --no-progress
          protoc --version

      - name: Configure MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Configure CMake (Debug)
        run: cmake --preset ci-windows-msvc -DCMAKE_COMPILE_WARNING_AS_ERROR=ON

      - name: Build
        run: cmake --build --preset ci-windows-msvc

      - name: Check installed package consumers
        run: cmake --build --preset ci-windows-msvc --target check-install

      - name: Test C17 consumer
        run: ctest --preset ci-windows-msvc-c17

      - name: Test C++ consumer
        run: ctest --preset ci-windows-msvc-consumer

  build_almalinux:
    name: Build on AlmaLinux 10
    # EXPERIMENT BRANCH ONLY: a dispatch on this branch must start just the
    # sccache comparison, so the compatibility pair keeps the schedule alone.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    container:
      image: almalinux:10
    # The cold AlmaLinux job took 45 minutes on the current cache key.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Enable CRB and EPEL repos
        run: |
          dnf install -y dnf-plugins-core epel-release
          dnf config-manager --set-enabled crb

      - name: Install Apache Arrow repo
        run: >
          dnf install -y
          "https://packages.apache.org/artifactory/arrow/almalinux/10/apache-arrow-release-latest.rpm"

      - name: Install build tools
        run: dnf install -y curl gcc gcc-c++ cmake ninja-build protobuf-compiler protobuf-devel rust cargo arrow-devel pkgconf-pkg-config valgrind git boost-devel

      # Keep the distribution rustc and cargo while they meet the crate MSRV;
      # only an older distribution falls back to the repository toolchain. The
      # selection runs before the cache so the cache sees the compiler that
      # builds the job.
      # See https://github.com/lancedb/lancedb-c/pull/109 for the distro policy.
      - name: Select the Rust toolchain
        shell: bash
        run: bash .github/scripts/select_almalinux_rust.sh

      # The earlier cache entry was saved for a host-side target path and a
      # full-match restore skips saving, so the corrected container-workspace
      # target needs its own key.
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: almalinux-cargo-target

      - name: Configure CMake
        run: |
          mkdir -p build
          cd build
          cmake .. -G Ninja -DBUILD_EXAMPLES=ON -DBUILD_ASIO_COROUTINE_EXAMPLE=ON \
            -DBUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_COMPILE_WARNING_AS_ERROR=ON \
            -DLANCEDB_CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target"

      - name: Build
        run: ninja -C build

      - name: Check installed package consumers
        run: ninja -C build check-install

      - name: Test
        run: ctest --test-dir build -j --output-on-failure

  cross_compile:
    name: Cross-compile Windows on Linux
    # EXPERIMENT BRANCH ONLY: a dispatch on this branch must start just the
    # sccache comparison, so the compatibility pair keeps the schedule alone.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    # A MinGW run with both the Rust and Arrow caches missing took 57m36s.
    # Keep headroom for the same double-miss path.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '4.1'

      - name: Install Rust from rust-toolchain.toml
        run: rustup toolchain install

      - name: Add the Windows GNU target
        run: rustup target add x86_64-pc-windows-gnu

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 protobuf-compiler

      - name: Create toolchain file
        run: |
          cat <<EOF > toolchain.cmake
          set(CMAKE_SYSTEM_NAME Windows)
          set(CMAKE_SYSTEM_PROCESSOR x86_64)
          set(CMAKE_C_COMPILER x86_64-w64-mingw32-gcc-posix)
          set(CMAKE_CXX_COMPILER x86_64-w64-mingw32-g++-posix)
          set(CMAKE_RC_COMPILER x86_64-w64-mingw32-windres)
          set(CMAKE_FIND_ROOT_PATH_MODE_PROGRAM NEVER)
          set(CMAKE_FIND_ROOT_PATH_MODE_LIBRARY ONLY)
          set(CMAKE_FIND_ROOT_PATH_MODE_INCLUDE ONLY)
          EOF

      - name: Cache Arrow
        id: cache-arrow
        uses: actions/cache@v6
        with:
          path: arrow-install
          key: ${{ runner.os }}-mingw-arrow-22.0.0

      - name: Build Arrow
        if: steps.cache-arrow.outputs.cache-hit != 'true'
        run: |
          wget https://archive.apache.org/dist/arrow/arrow-22.0.0/apache-arrow-22.0.0.tar.gz
          tar xzf apache-arrow-22.0.0.tar.gz
          mkdir -p arrow-install
          cd apache-arrow-22.0.0/cpp
          mkdir -p build && cd build
          cmake .. -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$GITHUB_WORKSPACE/toolchain.cmake \
            -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/arrow-install \
            -DARROW_BUILD_SHARED=OFF \
            -DARROW_BUILD_STATIC=ON \
            -DARROW_WITH_RE2=OFF \
            -DARROW_WITH_UTF8PROC=OFF \
            -DCMAKE_BUILD_TYPE=Release
          ninja install

      - name: Configure CMake
        run: |
          mkdir -p build
          cd build
          cmake .. -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$GITHUB_WORKSPACE/toolchain.cmake \
            -DCMAKE_PREFIX_PATH=$GITHUB_WORKSPACE/arrow-install \
            -DCMAKE_COMPILE_WARNING_AS_ERROR=ON \
            -DLANCEDB_CARGO_TARGET_DIR=$GITHUB_WORKSPACE/target \
            -DBUILD_EXAMPLES=OFF -DBUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: ninja -C build

  # EXPERIMENT ONLY (C #198, disposable branch; not for merge): measures whether
  # sccache launchers for the ordinary GCC and the sanitizer Clang C/C++ builds
  # beat the existing Rust cache alone across one real SDK lockfile bump. Both
  # arms take identical steps; only the treatment arm installs sccache and passes
  # the compiler launchers. Phase `seed` builds A on fresh runners and stores
  # both caches, phase `warm` builds B on fresh runners and restores them.
  sccache-compare:
    name: sccache compare ${{ matrix.arm }} (${{ inputs.phase }})
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      SCCACHE_GHA_ENABLED: 'on'
      SCCACHE_GHA_VERSION: c198-sccache-v1
      SCCACHE_LOG: sccache=info
      SEED_SHA: 50ec12b61ae48b815bd12a0bfb43d6d503289e57
      WARM_SHA: 171f33b062c90f2f30e0133a47bd8f4ebb08aafe
    strategy:
      fail-fast: false
      matrix:
        include:
          - arm: control
            sccache: 'off'
          - arm: sccache
            sccache: 'on'
        # EXPERIMENT BRANCH ONLY: a candidate-only dispatch drops the control row
        # so it can reuse the control archive an earlier seed already saved. The
        # default value keeps both rows, and the warm phase always needs both.
        exclude:
          - arm: ${{ inputs.arm == 'candidate' && 'control' || 'none' }}

    steps:
      - name: Select checkout ref for the phase
        run: |
          set -euo pipefail
          case "${{ inputs.phase }}" in
            seed) sha="$SEED_SHA" ;;
            warm) sha="$WARM_SHA" ;;
            *) echo "::error::unknown phase ${{ inputs.phase }}"; exit 1 ;;
          esac
          {
            echo "CHECKOUT_SHA=$sha"
            echo "PHASE=${{ inputs.phase }}"
            echo "M_START=$(date -u +%s)"
          } >> "$GITHUB_ENV"

      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CHECKOUT_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify the checked-out source tree
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          tree="$(git rev-parse HEAD^{tree})"
          dirty="$(git status --porcelain)"
          {
            echo "### sccache comparison: ${{ matrix.arm }} arm, ${{ inputs.phase }} phase"
            echo ""
            echo "| input | value |"
            echo "| --- | --- |"
            echo "| checked out sha | \`${actual}\` |"
            echo "| expected sha | \`${CHECKOUT_SHA}\` |"
            echo "| tree | \`${tree}\` |"
            echo "| worktree dirty | \`${dirty:-no}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$dirty" ]; then
            echo "::error::worktree is not clean after checkout"
            printf '%s\n' "$dirty"
            exit 1
          fi
          if [ "$actual" != "$CHECKOUT_SHA" ]; then
            echo "::error::checked out $actual but the phase requires $CHECKOUT_SHA"
            exit 1
          fi

      - name: Record runner and toolchain identity
        run: |
          set -euo pipefail
          {
            echo "| os release | \`$(sed -n 's/^PRETTY_NAME=//p' /etc/os-release | tr -d '\"')\` |"
            echo "| kernel | \`$(uname -r)\` |"
            echo "| cpus | \`$(nproc)\` |"
            echo "| rustc | \`$(rustc -vV | tr '\n' ' ')\` |"
            echo "| gcc version | \`$(gcc --version | head -1)\` |"
            echo "| gcc path | \`$(command -v gcc)\` |"
            echo "| gcc sha256 | \`$(sha256sum "$(command -v gcc)" | cut -d' ' -f1)\` |"
            echo "| gcc mtime | \`$(stat -c %y "$(command -v gcc)")\` |"
            echo "| cmake | \`$(cmake --version | head -1)\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          rustc -vV
          gcc --version | head -1

      - name: Install Rust from rust-toolchain.toml
        run: rustup toolchain install

      - name: Cache Rust dependencies
        id: rust-cache
        uses: Swatinem/rust-cache@v2
        with:
          # One namespace per arm, identical across the two phases so the warm
          # phase restores the archive the seed phase saved for that arm.
          prefix-key: v0-rust-c198-sccache-${{ matrix.arm }}

      - name: Record Rust cache restore result
        run: |
          {
            echo "| rust cache exact hit | \`${{ steps.rust-cache.outputs.cache-hit }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "rust cache exact hit: ${{ steps.rust-cache.outputs.cache-hit }}"
          echo "the restore key the action used is recorded in the Cache Rust dependencies step log"

      - name: Install dependencies (Ubuntu)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y lsb-release valgrind
          wget https://apache.jfrog.io/artifactory/arrow/$(lsb_release --id --short | tr 'A-Z' 'a-z')/apache-arrow-apt-source-latest-$(lsb_release --codename --short).deb
          sudo apt-get install -y ./apache-arrow-apt-source-latest-$(lsb_release --codename --short).deb
          sudo apt-get update
          sudo apt-get install -y libarrow-dev libboost-coroutine-dev libboost-context-dev
          echo "M_DEPS=$(date -u +%s)" >> "$GITHUB_ENV"

      - name: Install pinned sccache
        if: matrix.sccache == 'on'
        # Official setup action, pinned by commit. It installs the pinned sccache
        # release, puts it on PATH and exports the job's ephemeral GHA cache
        # tokens for later shell steps; it does not set RUSTC_WRAPPER, so Rust
        # builds stay untouched.
        uses: Mozilla-Actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.20.1
          disable_annotations: 'false'

      - name: Configure sccache GHA backend and probe it
        if: matrix.sccache == 'on'
        run: |
          set -euo pipefail
          # The setup action exports the job's ephemeral GHA cache tokens for
          # shell steps; without them the backend cannot authenticate.
          for name in ACTIONS_RUNTIME_TOKEN ACTIONS_RESULTS_URL; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is missing after the sccache setup action, so the GHA cache backend cannot authenticate"
              exit 1
            fi
          done
          {
            echo "SCCACHE_DIR=$RUNNER_TEMP/sccache-disk"
            echo "SCCACHE_ERROR_LOG=$RUNNER_TEMP/sccache-error.log"
          } >> "$GITHUB_ENV"
          # The server this step starts must use the same fresh directory the
          # later steps get from GITHUB_ENV, so the phase starts with no local
          # sccache objects and every warm hit has to come from the backend.
          export SCCACHE_DIR="$RUNNER_TEMP/sccache-disk"
          export SCCACHE_ERROR_LOG="$RUNNER_TEMP/sccache-error.log"
          mkdir -p "$RUNNER_TEMP/sccache-stats"
          sccache --stop-server >/dev/null 2>&1 || true
          sccache --start-server
          sccache --show-adv-stats --stats-format=json > "$RUNNER_TEMP/sccache-stats/0-base.json"
          # One fixed probe translation unit: the seed phase stores its object,
          # and the warm phase asks for the same key before any project compile,
          # so a warm hit is a real cross-run restore rather than a local reuse.
          printf 'int c198_sccache_probe(void) { return 42; }\n' > "$RUNNER_TEMP/sccache-probe.c"
          ( cd "$RUNNER_TEMP" && sccache gcc -O2 -c sccache-probe.c -o sccache-probe.o )
          sccache --show-adv-stats --stats-format=json > "$RUNNER_TEMP/sccache-stats/1-probe.json"
          probe="$RUNNER_TEMP/sccache-stats/1-probe.json"
          hits=$(jq '[.stats.cache_hits.counts | to_entries[].value] | add // 0' "$probe")
          misses=$(jq '[.stats.cache_misses.counts | to_entries[].value] | add // 0' "$probe")
          writes=$(jq -r '.stats.cache_writes' "$probe")
          read_errors=$(jq -r '.stats.cache_read_errors' "$probe")
          write_errors=$(jq -r '.stats.cache_write_errors' "$probe")
          echo "cache location: $(jq -r '.cache_location' "$probe")"
          echo "probe: hits=$hits misses=$misses writes=$writes read_errors=$read_errors write_errors=$write_errors"
          if [ "$read_errors" -ne 0 ] || [ "$write_errors" -ne 0 ]; then
            echo "::error::the GHA cache backend reported read or write errors, so any comparison would be meaningless"
            exit 1
          fi
          if [ "$PHASE" = "seed" ] && [ "$writes" -lt 1 ]; then
            echo "::error::the seed phase stored no sccache object, so the warm phase would have nothing to restore"
            exit 1
          fi
          if [ "$PHASE" = "warm" ] && [ "$hits" -lt 1 ]; then
            echo "::warning::the warm probe missed: the object the seed phase stored could not be restored, so compiler identity or the cache namespace changed between phases"
          fi
          echo "M_SCCACHE=$(date -u +%s)" >> "$GITHUB_ENV"

      - name: Configure CMake
        run: |
          set -euo pipefail
          launcher_args=()
          if [ "${{ matrix.sccache }}" = "on" ]; then
            launcher_args+=(-DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache)
          fi
          cmake --preset ci-linux-shared -DCMAKE_COMPILE_WARNING_AS_ERROR=ON "${launcher_args[@]}"
          echo "M_CONFIGURE=$(date -u +%s)" >> "$GITHUB_ENV"

      - name: Build
        run: |
          set -euo pipefail
          cmake --build --preset ci-linux-shared
          echo "M_BUILD=$(date -u +%s)" >> "$GITHUB_ENV"

      - name: Snapshot sccache stats after the library build
        if: matrix.sccache == 'on'
        run: |
          sccache --show-adv-stats --stats-format=json > "$RUNNER_TEMP/sccache-stats/2-build.json"
          sccache --show-stats | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Check installed package consumers
        run: cmake --build --preset ci-linux-shared --target check-install

      - name: Check C17 consumer
        run: cmake --build --preset ci-linux-shared --target check-c17

      - name: Test
        run: ctest --preset ci-linux-shared -j

      - name: Snapshot sccache stats after the ordinary configuration
        if: matrix.sccache == 'on'
        run: |
          sccache --show-adv-stats --stats-format=json > "$RUNNER_TEMP/sccache-stats/3-ordinary.json"
          echo "M_ORDINARY=$(date -u +%s)" >> "$GITHUB_ENV"

      - name: Install Clang and llvm symbolizer
        run: |
          sudo apt-get install -y clang llvm
          clang --version
          llvm-symbolizer --version
          {
            echo "| clang | \`$(clang --version | head -1)\` |"
            echo "| clang sha256 | \`$(sha256sum "$(command -v clang)" | cut -d' ' -f1)\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Configure sanitizer build
        run: |
          set -euo pipefail
          launcher_args=()
          if [ "${{ matrix.sccache }}" = "on" ]; then
            launcher_args+=(-DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache)
          fi
          cmake -S . -B build-sanitize -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=undefined" \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=undefined" \
            -DBUILD_SHARED_LIBS=ON \
            -DBUILD_TESTS=ON \
            -DBUILD_CONSUMER_TEST=ON \
            -DVALGRIND_EXECUTABLE=OFF \
            -DLANCEDB_CARGO_TARGET_DIR="${{ github.workspace }}/target" \
            "${launcher_args[@]}"

      - name: Build sanitizer consumers
        run: cmake --build build-sanitize --verbose

      - name: Show sanitizer test roster
        run: ctest --test-dir build-sanitize -N -V

      - name: Run sanitizer tests
        env:
          UBSAN_OPTIONS: print_stacktrace=1
        run: ctest --test-dir build-sanitize --output-on-failure --no-tests=error

      - name: Snapshot sccache stats after the sanitizer configuration
        if: matrix.sccache == 'on'
        run: |
          sccache --show-adv-stats --stats-format=json > "$RUNNER_TEMP/sccache-stats/4-sanitizer.json"
          echo "M_SANITIZER=$(date -u +%s)" >> "$GITHUB_ENV"

      - name: Report sccache hits per segment
        if: matrix.sccache == 'on'
        run: |
          set -euo pipefail
          stats="$RUNNER_TEMP/sccache-stats"
          hits_total() { jq '[.stats.cache_hits.counts | to_entries[].value] | add // 0' "$1"; }
          misses_total() { jq '[.stats.cache_misses.counts | to_entries[].value] | add // 0' "$1"; }
          scalar() { jq -r ".stats.$2" "$1"; }
          segments=(
            "1-probe.json:probe translation unit"
            "2-build.json:library build (ordinary GCC)"
            "3-ordinary.json:install, C17, CTest"
            "4-sanitizer.json:sanitizer build (Clang)"
          )
          {
            echo ""
            echo "### sccache per segment"
            echo ""
            echo "| segment | hits | misses | compilations | writes |"
            echo "| --- | --- | --- | --- | --- |"
            previous="$stats/0-base.json"
            for entry in "${segments[@]}"; do
              current="$stats/${entry%%:*}"
              label="${entry#*:}"
              printf '| %s | %s | %s | %s | %s |\n' "$label" \
                "$(( $(hits_total "$current") - $(hits_total "$previous") ))" \
                "$(( $(misses_total "$current") - $(misses_total "$previous") ))" \
                "$(( $(scalar "$current" compilations) - $(scalar "$previous" compilations) ))" \
                "$(( $(scalar "$current" cache_writes) - $(scalar "$previous" cache_writes) ))"
              previous="$current"
            done
            echo ""
            echo "| segment | language | hits | misses |"
            echo "| --- | --- | --- | --- |"
            previous="$stats/0-base.json"
            for entry in "${segments[@]}"; do
              current="$stats/${entry%%:*}"
              label="${entry#*:}"
              for language in $(jq -r '.stats.cache_hits.counts, .stats.cache_misses.counts | keys[]' "$previous" "$current" | sort -u); do
                hits=$(( $(jq -r --arg l "$language" '.stats.cache_hits.counts[$l] // 0' "$current") - $(jq -r --arg l "$language" '.stats.cache_hits.counts[$l] // 0' "$previous") ))
                misses=$(( $(jq -r --arg l "$language" '.stats.cache_misses.counts[$l] // 0' "$current") - $(jq -r --arg l "$language" '.stats.cache_misses.counts[$l] // 0' "$previous") ))
                if [ "$hits" -ne 0 ] || [ "$misses" -ne 0 ]; then
                  printf '| %s | %s | %s | %s |\n' "$label" "$language" "$hits" "$misses"
                fi
              done
              previous="$current"
            done
            echo ""
            echo "| segment | compiler key | hits | misses |"
            echo "| --- | --- | --- | --- |"
            previous="$stats/0-base.json"
            for entry in "${segments[@]}"; do
              current="$stats/${entry%%:*}"
              label="${entry#*:}"
              # Advertised keys look like "c [gcc]" or "c++ [clang]", so read them
              # line by line instead of word splitting.
              while IFS= read -r key; do
                hits=$(( $(jq -r --arg k "$key" '.stats.cache_hits.adv_counts[$k] // 0' "$current") - $(jq -r --arg k "$key" '.stats.cache_hits.adv_counts[$k] // 0' "$previous") ))
                misses=$(( $(jq -r --arg k "$key" '.stats.cache_misses.adv_counts[$k] // 0' "$current") - $(jq -r --arg k "$key" '.stats.cache_misses.adv_counts[$k] // 0' "$previous") ))
                if [ "$hits" -ne 0 ] || [ "$misses" -ne 0 ]; then
                  printf '| %s | `%s` | %s | %s |\n' "$label" "$key" "$hits" "$misses"
                fi
              done < <(jq -r '.stats.cache_hits.adv_counts, .stats.cache_misses.adv_counts | keys[]' "$previous" "$current" | sort -u)
              previous="$current"
            done
            echo ""
            echo "- cache read errors: $(scalar "$stats/4-sanitizer.json" cache_read_errors)"
            echo "- cache write errors: $(scalar "$stats/4-sanitizer.json" cache_write_errors)"
            echo "- cache location: \`$(jq -r '.cache_location' "$stats/4-sanitizer.json")\`"
            echo "- sccache version: \`$(jq -r '.version' "$stats/4-sanitizer.json")\`"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Report segmented timings
        run: |
          set -euo pipefail
          {
            echo ""
            echo "### segmented wall clock"
            echo ""
            echo "| marker | seconds from job start |"
            echo "| --- | --- |"
            start="${M_START:-0}"
            for name in M_DEPS M_SCCACHE M_CONFIGURE M_BUILD M_ORDINARY M_SANITIZER; do
              value="${!name:-}"
              [ -n "$value" ] || continue
              echo "| ${name} | $(( value - start )) |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Show test diagnostics
        if: failure()
        run: |
          for log in build/Testing/Temporary/LastTest.log \
                     build-sanitize/Testing/Temporary/LastTest.log; do
            if [ -f "$log" ]; then
              echo "::group::$log"
              cat "$log"
              echo "::endgroup::"
            fi
          done
          for log in build/valgrind_*.txt; do
            [ -e "$log" ] || continue
            echo "::group::$log"
            cat "$log"
            echo "::endgroup::"
          done
          if [ -f "$RUNNER_TEMP/sccache-error.log" ]; then
            echo "::group::sccache log (tail)"
            tail -200 "$RUNNER_TEMP/sccache-error.log"
            echo "::endgroup::"
          fi
