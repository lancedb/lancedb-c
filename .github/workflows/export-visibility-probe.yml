# Temporary feasibility probe for #99. This workflow is removed before the
# change is proposed for review.
name: Export Visibility Probe

on:
  push:
    branches:
      - xuanwo/shared-library-export-visibility
  workflow_dispatch:

permissions:
  contents: read

jobs:
  msvc-export-file:
    name: MSVC export file on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            arch: amd64
            machine: X64
          - runner: windows-11-arm
            arch: arm64
            machine: ARM64

    steps:
      - name: Check out the probe
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}

      - name: Exercise lib.exe and link.exe export-file behavior
        shell: pwsh
        env:
          PROBE_MACHINE: ${{ matrix.machine }}
        run: |
          $ErrorActionPreference = "Stop"
          $root = Join-Path $PWD "probe"
          Remove-Item -Recurse -Force $root -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $root | Out-Null
          Push-Location $root

          @'
          __declspec(dllexport) int dep_private(void) { return 17; }
          '@ | Set-Content -Encoding ascii dep.c
          @'
          int dep_private(void);
          int lancedb_public(void) { return dep_private(); }
          '@ | Set-Content -Encoding ascii api.c
          @'
          LIBRARY lancedb.dll
          EXPORTS
            lancedb_public
          '@ | Set-Content -Encoding ascii public.def
          @'
          #include <stdio.h>
          __declspec(dllimport) int lancedb_public(void);
          int main(void) {
            int value = lancedb_public();
            printf("value=%d\n", value);
            return value == 17 ? 0 : 1;
          }
          '@ | Set-Content -Encoding ascii consumer.c

          cl /nologo /c dep.c api.c
          if ($LASTEXITCODE -ne 0) { throw "cl failed" }

          New-Item -ItemType Directory -Force direct, paired, both | Out-Null
          link /nologo /dll /noentry /nodefaultlib /out:direct\lancedb.dll dep.obj api.obj public.def
          if ($LASTEXITCODE -ne 0) { throw "direct link failed" }

          lib /nologo /def:public.def /out:paired\lancedb.dll.lib /machine:$env:PROBE_MACHINE
          if ($LASTEXITCODE -ne 0) { throw "lib /def failed" }
          if (-not (Test-Path "paired\lancedb.dll.exp")) { throw "lib /def did not create an export file" }
          Copy-Item public.def both\public.def
          Copy-Item paired\lancedb.dll.exp both\lancedb.dll.exp
          Copy-Item paired\lancedb.dll.lib both\lancedb.dll.lib

          link /nologo /dll /noentry /nodefaultlib /out:paired\lancedb.dll dep.obj api.obj paired\lancedb.dll.exp
          if ($LASTEXITCODE -ne 0) { throw "paired export-file link failed" }
          link /nologo /dll /noentry /nodefaultlib /out:both\lancedb.dll dep.obj api.obj both\public.def both\lancedb.dll.exp
          if ($LASTEXITCODE -ne 0) { throw "export-file plus def link failed" }

          cl /nologo /W4 consumer.c /Fe:paired\consumer.exe /link /LIBPATH:paired lancedb.dll.lib
          if ($LASTEXITCODE -ne 0) { throw "consumer link failed" }
          Copy-Item paired\consumer.exe both\consumer.exe
          Copy-Item paired\consumer.exe direct\consumer.exe

          function Get-DllExports([string] $dll) {
            $names = @()
            foreach ($line in (& dumpbin /nologo /exports $dll)) {
              if ($line -match '^\s+\d+\s+[0-9A-Fa-f]+\s+[0-9A-Fa-f]+\s+(\S+)\s*$') {
                $names += $Matches[1]
              }
            }
            return $names
          }

          $direct = Get-DllExports "direct\lancedb.dll"
          $paired = Get-DllExports "paired\lancedb.dll"
          $both = Get-DllExports "both\lancedb.dll"
          Write-Output "direct exports: $($direct -join ',')"
          Write-Output "paired exports: $($paired -join ',')"
          Write-Output "both exports: $($both -join ',')"

          if (-not ($direct -contains "lancedb_public") -or -not ($direct -contains "dep_private")) {
            throw "the .def-only control did not reproduce the dependency export"
          }
          foreach ($case in @("paired", "both")) {
            $names = Get-Variable $case -ValueOnly
            if (($names | Sort-Object) -join "," -ne "lancedb_public") {
              throw "$case exported $($names -join ',') instead of only lancedb_public"
            }
          }

          $members = (& dumpbin /nologo /linkermember:1 paired\lancedb.dll.lib) -join "`n"
          if ($members -match "dep_private") {
            throw "the paired import library still references dep_private"
          }
          if ($members -notmatch "lancedb_public") {
            throw "the paired import library does not reference lancedb_public"
          }

          foreach ($case in @("paired", "both")) {
            $env:PATH = "$root\$case;$env:PATH"
            & "$root\$case\consumer.exe"
            if ($LASTEXITCODE -ne 0) { throw "$case consumer failed" }
          }

          Pop-Location
          Write-Output "native MSVC export-file probe passed"
