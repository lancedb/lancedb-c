name: Code Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: coverage-${{ github.event_name == 'push' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        id: rust
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: llvm-tools-preview

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config lsb-release wget
          wget https://apache.jfrog.io/artifactory/arrow/$(lsb_release --id --short | tr 'A-Z' 'a-z')/apache-arrow-apt-source-latest-$(lsb_release --codename --short).deb
          sudo apt-get install -y ./apache-arrow-apt-source-latest-$(lsb_release --codename --short).deb
          sudo apt-get update
          sudo apt-get install -y libarrow-dev

      - name: Configure CMake
        run: |
          mkdir -p build
          cd build
          cmake .. -G Ninja -DBUILD_TESTS=ON -DBUILD_COVERAGE=ON -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: ninja -C build

      - name: Generate coverage report
        run: ninja -C build coverage

      - name: Extract coverage percentage
        id: coverage
        run: |
          # Extract line coverage % from the TOTAL row (3rd percentage field = Lines Cover)
          LLVM_COV=$(find "$(rustc --print sysroot)" -name llvm-cov -type f | head -1)
          COVERAGE=$("$LLVM_COV" report build/target/debug/liblancedb.so \
            --instr-profile=build/coverage.profdata \
            src/ \
            | grep "^TOTAL" | awk '{for(i=1;i<=NF;i++) if($i ~ /%$/ && count++==2) {gsub(/%/,"",$i); print $i; exit}}')
          echo "percentage=$COVERAGE" >> $GITHUB_OUTPUT
          echo "Line coverage: $COVERAGE%"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build/coverage-report/

      # On main: save baseline coverage as artifact
      - name: Save baseline coverage
        if: github.ref == 'refs/heads/main'
        run: echo "${{ steps.coverage.outputs.percentage }}" > coverage-baseline.txt

      - name: Upload baseline coverage
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-baseline
          path: coverage-baseline.txt
          overwrite: true

      # On PR: download baseline from the merge-base commit on main
      - name: Find merge base
        if: github.event_name == 'pull_request'
        id: merge_base
        run: |
          MERGE_BASE=$(git merge-base HEAD origin/main)
          echo "sha=$MERGE_BASE" >> $GITHUB_OUTPUT
          echo "Merge base: $MERGE_BASE"

      - name: Download baseline coverage
        if: github.event_name == 'pull_request'
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: coverage.yml
          commit: ${{ steps.merge_base.outputs.sha }}
          name: coverage-baseline
          search_artifacts: true
          if_no_artifact_found: warn

      - name: Check baseline toolchain
        id: baseline_toolchain
        if: github.event_name == 'pull_request'
        run: |
          if [ -f coverage-baseline.txt ] && git diff --quiet "${{ steps.merge_base.outputs.sha }}" HEAD -- rust-toolchain.toml; then
            echo "matches=true" >> "$GITHUB_OUTPUT"
          else
            echo "matches=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build matching baseline
        if: github.event_name == 'pull_request' && steps.baseline_toolchain.outputs.matches != 'true'
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.rust.outputs.name }}
        run: |
          baseline_dir="$RUNNER_TEMP/coverage-baseline"
          git worktree add --detach "$baseline_dir" "${{ steps.merge_base.outputs.sha }}"
          mkdir -p "$baseline_dir/build"
          cd "$baseline_dir/build"
          cmake .. -G Ninja -DBUILD_TESTS=ON -DBUILD_COVERAGE=ON -DCMAKE_BUILD_TYPE=Debug
          ninja
          ninja coverage

      - name: Extract matching baseline
        if: github.event_name == 'pull_request' && steps.baseline_toolchain.outputs.matches != 'true'
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.rust.outputs.name }}
        run: |
          cd "$RUNNER_TEMP/coverage-baseline"
          LLVM_COV=$(find "$(rustc --print sysroot)" -name llvm-cov -type f | head -1)
          BASELINE_COVERAGE=$("$LLVM_COV" report build/target/debug/liblancedb.so \
            --instr-profile=build/coverage.profdata \
            src/ \
            | grep "^TOTAL" | awk '{for(i=1;i<=NF;i++) if($i ~ /%$/ && count++==2) {gsub(/%/,"",$i); print $i; exit}}')
          echo "Line coverage baseline: $BASELINE_COVERAGE%"
          echo "$BASELINE_COVERAGE" > "$GITHUB_WORKSPACE/coverage-baseline.txt"

      - name: Compare coverage with baseline
        if: github.event_name == 'pull_request'
        run: |
          HEAD_COVERAGE=${{ steps.coverage.outputs.percentage }}
          if [ ! -f coverage-baseline.txt ]; then
            echo "::error::No coverage baseline found for merge base ${{ steps.merge_base.outputs.sha }}"
            exit 1
          fi
          BASE_COVERAGE=$(cat coverage-baseline.txt)
          echo "Base branch coverage: $BASE_COVERAGE%"
          echo "PR branch coverage: $HEAD_COVERAGE%"
          DECREASED=$(echo "$BASE_COVERAGE $HEAD_COVERAGE" | awk '{if ($1 > $2) print "true"; else print "false"}')
          if [ "$DECREASED" = "true" ]; then
            echo "::error::Code coverage decreased from $BASE_COVERAGE% to $HEAD_COVERAGE%"
            exit 1
          else
            echo "Coverage is maintained or improved: $BASE_COVERAGE% -> $HEAD_COVERAGE%"
          fi
