name: Shared Library Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish a GitHub Release for this exact preview tag after all supported packages pass
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-script:
    name: Package script checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out the commit being tested
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Run packaging fixture checks
        run: python3 .github/scripts/test_package.py

      - name: Run release fixture checks
        run: python3 .github/scripts/test_release.py

  package:
    name: Package ${{ matrix.target }} on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            python: python3
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
            python: python3
          - target: aarch64-apple-darwin
            runner: macos-15
            python: python3
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
            python: python
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
            python: python

    steps:
      - name: Check out the commit being packaged
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify the checked-out head
        if: github.ref_type != 'tag'
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          expected="${{ github.sha }}"
          echo "checked out ${actual}"
          test "${actual}" = "${expected}"

      # A tag dispatch checks out the exact commit SHA with shallow history, so
      # the tag ref is not present. Fetch it explicitly and require its peeled
      # commit to be HEAD. This also rejects a tag on a parent or another branch.
      - name: Verify release tag
        id: release-tag
        if: github.ref_type == 'tag'
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          release_version="$("${{ matrix.python }}" .github/scripts/version.py validate-tag "${RELEASE_TAG}")"
          git fetch --force --no-tags origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          tag_object="$(git rev-parse "refs/tags/${RELEASE_TAG}")"
          tag_commit="$(git rev-parse "refs/tags/${RELEASE_TAG}^{}")"
          head_commit="$(git rev-parse HEAD)"
          echo "release tag: ${RELEASE_TAG}"
          echo "release version: ${release_version}"
          echo "tag object: ${tag_object}"
          echo "tag commit: ${tag_commit}"
          echo "checked out: ${head_commit}"
          if [ "${tag_commit}" != "${head_commit}" ]; then
            echo "::error::tag ${RELEASE_TAG} peels to ${tag_commit}, not the checked-out ${head_commit}"
            exit 1
          fi
          echo "LANCEDB_VERSION=${release_version}" >> "$GITHUB_ENV"
          echo "LANCEDB_TAG=${RELEASE_TAG}" >> "$GITHUB_ENV"
          echo "LANCEDB_TAG_OBJECT=${tag_object}" >> "$GITHUB_ENV"
          echo "LANCEDB_TAG_COMMIT=${tag_commit}" >> "$GITHUB_ENV"
          echo "commit=${tag_commit}" >> "$GITHUB_OUTPUT"

      # The locked Lance v15.0.0-beta.25 fixture contains a 188-character
      # relative test-data path. The default runner Cargo home makes Cargo's
      # git checkout path exceed Windows MAX_PATH; C:\c keeps the longest
      # checkout path at 238 characters, so use it only on Windows.
      - name: Use short Cargo home on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p /c/c
          echo 'CARGO_HOME=C:\c' >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Report runner architecture
        if: runner.os != 'Windows'
        run: |
          uname -a
          rustc -vV

      - name: Report runner architecture (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Output "PROCESSOR_ARCHITECTURE=$env:PROCESSOR_ARCHITECTURE"
          Write-Output "CARGO_HOME=$env:CARGO_HOME"
          rustc -vV

      - name: Install protoc (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ protobuf-compiler
          protoc --version

      - name: Install protoc (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install protobuf
          protoc --version

      - name: Install protoc (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install protoc --version=29.0.0 -y --no-progress
          protoc --version

      - name: Configure MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.target == 'aarch64-pc-windows-msvc' && 'arm64' || 'amd64' }}

      - name: Build shared library (macOS)
        if: runner.os == 'macOS'
        run: >
          cargo rustc --release --locked --package lancedb-c --target ${{ matrix.target }} --lib --
          -C link-arg=-Wl,-install_name,@rpath/liblancedb.dylib

      - name: Build shared library
        if: runner.os != 'macOS'
        run: cargo build --release --locked --package lancedb-c --target ${{ matrix.target }}

      - name: Create package
        id: package
        run: >
          ${{ matrix.python }} .github/scripts/package.py create
          --target ${{ matrix.target }}
          --commit ${{ steps.release-tag.outputs.commit || github.sha }}
          --output-dir dist

      - name: Verify package with a real consumer
        run: >
          ${{ matrix.python }} .github/scripts/package.py verify
          --target ${{ matrix.target }}
          --commit ${{ steps.release-tag.outputs.commit || github.sha }}
          --archive ${{ steps.package.outputs.archive }}
          --checksum ${{ steps.package.outputs.checksum }}

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: lancedb-c-${{ steps.release-tag.outputs.commit || github.sha }}-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: [package-script, package]
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref_type == 'tag' &&
      inputs.publish_release == true
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      # Resolve the dispatched tag independently of the package jobs. Both
      # refs are recorded; an annotated tag has a tag object distinct from its
      # commit, while a lightweight tag has the same object id for both. The
      # peeled commit must still be the checked-out commit.
      - name: Verify the release tag and peeled commit
        id: release-tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          HEAD_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          release_version="$(python3 .github/scripts/version.py validate-tag "${RELEASE_TAG}")"
          git fetch --force --no-tags origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          tag_object="$(git rev-parse "refs/tags/${RELEASE_TAG}")"
          tag_commit="$(git rev-parse "refs/tags/${RELEASE_TAG}^{}")"
          head_commit="$(git rev-parse HEAD)"
          echo "release tag: ${RELEASE_TAG}"
          echo "release version: ${release_version}"
          echo "tag ref object: ${tag_object}"
          echo "peeled commit: ${tag_commit}"
          echo "checked out: ${head_commit}"
          if [ "${tag_commit}" != "${head_commit}" ] || [ "${tag_commit}" != "${HEAD_COMMIT}" ]; then
            echo "::error::tag ${RELEASE_TAG} peels to ${tag_commit}, not ${HEAD_COMMIT}"
            exit 1
          fi
          echo "object=${tag_object}" >> "$GITHUB_OUTPUT"
          echo "commit=${tag_commit}" >> "$GITHUB_OUTPUT"

      - name: Download all verified packages
        uses: actions/download-artifact@v4
        with:
          pattern: lancedb-c-*
          path: release-artifacts
          merge-multiple: true

      # The matrix jobs already ran the real consumer checks. This step
      # re-verifies every archive, manifest and checksum against the exact tag
      # before a draft release is created.
      - name: Prepare verified release assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          TAG_OBJECT: ${{ steps.release-tag.outputs.object }}
          TAG_COMMIT: ${{ steps.release-tag.outputs.commit }}
        run: >
          python3 .github/scripts/release.py prepare
          --tag "$RELEASE_TAG"
          --tag-object "$TAG_OBJECT"
          --tag-commit "$TAG_COMMIT"
          --head-commit "$TAG_COMMIT"
          --repo-root .
          --artifacts release-artifacts
          --output release
          --github-output "$GITHUB_OUTPUT"

      - name: Create draft and publish after all assets attach
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: >
          python3 .github/scripts/release.py publish
          --metadata release/release-metadata.json
          --repository "$RELEASE_REPOSITORY"
