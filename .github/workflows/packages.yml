name: Shared Library Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-script:
    name: Package script checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out the commit being tested
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Run packaging fixture checks
        run: python3 .github/scripts/test_package.py

  package:
    name: Package ${{ matrix.target }} on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            python: python3
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
            python: python3
          - target: aarch64-apple-darwin
            runner: macos-15
            python: python3
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
            python: python
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
            python: python

    steps:
      - name: Check out the commit being packaged
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Resolve the checked-out commit
        id: source
        shell: bash
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Verify the checked-out head
        if: github.ref_type != 'tag'
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          echo "checked out ${actual}"
          test "${actual}" = "${{ github.sha }}"

      - name: Verify the release tag
        if: github.ref_type == 'tag'
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          case "${RELEASE_TAG}" in
            v*) ;;
            *) echo "::error::release packages require a v* tag"; exit 1 ;;
          esac
          git fetch --force --no-tags origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          tag_commit="$(git rev-parse "refs/tags/${RELEASE_TAG}^{}")"
          head_commit="$(git rev-parse HEAD)"
          echo "release tag: ${RELEASE_TAG}"
          echo "tag commit: ${tag_commit}"
          echo "checked out: ${head_commit}"
          test "${tag_commit}" = "${head_commit}"

      # The locked Lance v15.0.0-beta.25 fixture contains a 188-character
      # relative test-data path. The default runner Cargo home makes Cargo's
      # git checkout path exceed Windows MAX_PATH; C:\c keeps the longest
      # checkout path at 238 characters, so use it only on Windows.
      - name: Use short Cargo home on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p /c/c
          echo 'CARGO_HOME=C:\c' >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Report runner architecture
        if: runner.os != 'Windows'
        run: |
          uname -a
          rustc -vV

      - name: Report runner architecture (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Output "PROCESSOR_ARCHITECTURE=$env:PROCESSOR_ARCHITECTURE"
          Write-Output "CARGO_HOME=$env:CARGO_HOME"
          rustc -vV

      - name: Install protoc (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ protobuf-compiler
          protoc --version

      - name: Install protoc (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install protobuf
          protoc --version

      - name: Install protoc (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install protoc --version=29.0.0 -y --no-progress
          protoc --version

      - name: Configure MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.target == 'aarch64-pc-windows-msvc' && 'arm64' || 'amd64' }}

      - name: Build shared library (macOS)
        if: runner.os == 'macOS'
        run: >
          cargo rustc --release --locked --target ${{ matrix.target }} --lib --
          -C link-arg=-Wl,-install_name,@rpath/liblancedb.dylib

      - name: Build shared library
        if: runner.os != 'macOS'
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Create package
        id: package
        run: >
          ${{ matrix.python }} .github/scripts/package.py create
          --target ${{ matrix.target }}
          --commit ${{ steps.source.outputs.commit }}
          --output-dir dist

      - name: Verify package with a real consumer
        run: >
          ${{ matrix.python }} .github/scripts/package.py verify
          --target ${{ matrix.target }}
          --commit ${{ steps.source.outputs.commit }}
          --archive ${{ steps.package.outputs.archive }}
          --checksum ${{ steps.package.outputs.checksum }}

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: lancedb-c-${{ steps.source.outputs.commit }}-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
