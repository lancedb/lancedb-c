name: Documentation

on:
  push:
    branches: [main]
    # The docs build reads docs/, the public header, Doxyfile, the CMake and
    # pkg-config inputs, the hello.c literalinclude, and the version helper.
    paths:
      - 'docs/**'
      - 'Doxyfile'
      - 'include/lancedb.h'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'lancedb.pc.in'
      - 'examples/hello.c'
      - 'rust-toolchain.toml'
      - '.github/scripts/version.py'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [main]
    # Keep the same input list for pull requests so code-only changes do not
    # rebuild the documentation site.
    paths:
      - 'docs/**'
      - 'Doxyfile'
      - 'include/lancedb.h'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'lancedb.pc.in'
      - 'examples/hello.c'
      - 'rust-toolchain.toml'
      - '.github/scripts/version.py'
      - '.github/workflows/docs.yml'

# Pull requests build independently and cancel superseded runs for the same PR.
# Pushes to main share the "pages" group so deployments keep their current order
# and an in-progress deployment is never cancelled.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The build only reads the repository. Pages and OIDC permissions belong to the
# deployment job.
permissions:
  contents: read

jobs:
  build-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake doxygen

      - name: Install Python dependencies
        run: |
          pip install -r docs/requirements.txt

      - name: Configure CMake
        run: |
          mkdir -p build
          cd build
          cmake .. -DBUILD_DOCS=ON

      - name: Build documentation
        run: cmake --build build --target docs

      - name: Upload documentation artifacts
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: documentation
          path: build/docs/html
          retention-days: 7

      - name: Upload artifact to Pages
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/docs/html

  # Deploy in a separate job, as recommended by actions/deploy-pages. This lets
  # the uploaded Pages artifact finish propagating before deployment reads it;
  # running deployment in the upload job can observe zero artifacts.
  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build-docs
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
