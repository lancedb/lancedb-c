name: Export Probe

on:
  push:
    branches:
      - xuanwo/shared-library-export-visibility
  workflow_dispatch:

permissions:
  contents: read

jobs:
  msvc-implib:
    name: MSVC implib from exp on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            arch: amd64
            machine: X64
          - runner: windows-11-arm
            arch: arm64
            machine: ARM64
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}
      - name: Check whether link.exe creates an implib from an export file
        shell: pwsh
        env:
          MACHINE: ${{ matrix.machine }}
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force probe | Out-Null
          Set-Location probe
          @'
          __declspec(dllexport) int dep_private(void) { return 17; }
          '@ | Set-Content -Encoding ascii dep.c
          @'
          int dep_private(void);
          int lancedb_public(void) { return dep_private(); }
          '@ | Set-Content -Encoding ascii api.c
          @'
          LIBRARY lancedb.dll
          EXPORTS
            lancedb_public
          '@ | Set-Content -Encoding ascii public.def
          cl /nologo /c dep.c api.c
          New-Item -ItemType Directory -Force seed, created | Out-Null
          lib /nologo /def:public.def /out:seed\lancedb.dll.lib /machine:$env:MACHINE
          if ($LASTEXITCODE -ne 0) { throw "seed lib failed" }
          link /nologo /dll /noentry /nodefaultlib /out:seed\lancedb.dll dep.obj api.obj /IMPLIB:created\lancedb.dll.lib seed\lancedb.dll.exp
          if ($LASTEXITCODE -ne 0) { throw "link failed" }
          Write-Output "created lib exists: $(Test-Path created\lancedb.dll.lib)"
          if (Test-Path created\lancedb.dll.lib) {
            $members = (& dumpbin /nologo /linkermember:1 created\lancedb.dll.lib) -join "`n"
            Write-Output "created lib has dep_private: $($members -match 'dep_private')"
            Write-Output "created lib has public: $($members -match 'lancedb_public')"
          }
          $exports = (& dumpbin /nologo /exports seed\lancedb.dll) -join "`n"
          Write-Output "seed dll exports: $((($exports -split "`n") | Select-String 'lancedb_public|dep_private') -join ';')"
