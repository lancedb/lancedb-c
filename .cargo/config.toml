[env]
AWS_LC_SYS_CMAKE_BUILDER = "1"

# The linker wrapper only rewrites the final liblancedb cdylib's export list.
# It forwards build-script and external-provider links unchanged.
[target.x86_64-unknown-linux-gnu]
linker = "./cmake/export-linker.sh"

[target.aarch64-unknown-linux-gnu]
linker = "./cmake/export-linker.sh"

[target.aarch64-apple-darwin]
linker = "./cmake/export-linker.sh"
