[package]
name = "lancedb-c"
version = "0.0.0"
edition = "2021"
description = "C bindings for LanceDB"
homepage = "https://lancedb.github.io/lancedb-c/"
documentation = "https://lancedb.github.io/lancedb-c/"
readme = "README.md"
repository = "https://github.com/lancedb/lancedb-c"
license = "Apache-2.0"
keywords = ["database", "vector", "search", "c", "ffi"]
categories = ["database", "api-bindings"]
publish = false
rust-version = "1.95.0"

[workspace]
members = ["examples/external_provider"]
default-members = ["."]
resolver = "2"

[lib]
name = "lancedb"
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
# Forwarded features of the pinned lancedb SDK. Prebuilt packages use the
# defaults; source builds can narrow them with --no-default-features.
default = ["remote", "aws", "gcs", "azure", "dynamodb"]
remote = ["lancedb/remote"]
aws = ["lancedb/aws"]
gcs = ["lancedb/gcs"]
azure = ["lancedb/azure"]
oss = ["lancedb/oss"]
dynamodb = ["lancedb/dynamodb"]
geo = ["lancedb/geo"]
fp16kernels = ["lancedb/fp16kernels"]

[dependencies]
tokio = { version = "1.23", features = ["rt-multi-thread"] }
libc = "0.2"
lancedb = { git = "https://github.com/lancedb/lancedb", tag = "v0.42.0-beta.24", default-features = false }
lance = { git = "https://github.com/lance-format/lance.git", tag = "v15.0.0-beta.27" }
lance-io = { git = "https://github.com/lance-format/lance.git", tag = "v15.0.0-beta.27" }
lance-namespace = { git = "https://github.com/lance-format/lance.git", tag = "v15.0.0-beta.27" }
arrow-array = "59.2.0"
arrow-ipc = "59.2.0"
arrow-schema = "59.2.0"
datafusion-functions-json = "0.55"
futures = "0"
stacker = "0.1"

[profile.release]
opt-level = 3
strip = "debuginfo"
panic = "unwind"
