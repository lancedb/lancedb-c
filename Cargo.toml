[package]
name = "lancedb-c"
version = "0.0.0"
edition = "2021"
description = "C bindings for LanceDB"
homepage = "https://lancedb.github.io/lancedb-c/"
documentation = "https://lancedb.github.io/lancedb-c/"
readme = "README.md"
repository = "https://github.com/lancedb/lancedb-c"
license = "Apache-2.0"
keywords = ["database", "vector", "search", "c", "ffi"]
categories = ["database", "api-bindings"]
publish = false
rust-version = "1.95.0"

[workspace]
members = ["examples/external_provider"]
default-members = ["."]
resolver = "2"

[lib]
name = "lancedb"
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
# Forwarded features of the pinned lancedb SDK. Prebuilt packages use the
# defaults; source builds can narrow them with --no-default-features.
default = ["remote", "aws", "gcs", "azure", "dynamodb"]
remote = ["lancedb/remote"]
aws = ["lancedb/aws"]
gcs = ["lancedb/gcs"]
azure = ["lancedb/azure"]
oss = ["lancedb/oss"]
dynamodb = ["lancedb/dynamodb"]
geo = ["lancedb/geo"]
fp16kernels = ["lancedb/fp16kernels"]

[dependencies]
tokio = { version = "1.23", features = ["rt-multi-thread"] }
libc = "0.2"
lancedb = { git = "https://github.com/lancedb/lancedb", tag = "v0.42.0-beta.30", default-features = false }
lance = { git = "https://github.com/lance-format/lance.git", tag = "v15.0.0-beta.35" }
lance-io = { git = "https://github.com/lance-format/lance.git", tag = "v15.0.0-beta.35" }
lance-namespace = { git = "https://github.com/lance-format/lance.git", tag = "v15.0.0-beta.35" }
arrow-array = "59.2.0"
arrow-schema = "59.2.0"
datafusion-functions-json = "0.55"
futures = "0"
half = "2.7"
stacker = "0.1"

[profile.release]
opt-level = 3
strip = "debuginfo"
panic = "unwind"

# EXPERIMENT ONLY (C #198, disposable branch; not for merge): candidate routine
# CI profile. It inherits release so panics, assertions, overflow checks and
# every other release default stay in force; only optimization and debug
# information differ. Workspace crates build unoptimized, dependencies at
# opt-level 2, and the emitted library keeps line tables so Valgrind and the
# sanitizer suites can symbolize Rust frames.
[profile.ci]
inherits = "release"
opt-level = 0
debug = "line-tables-only"
strip = "none"

[profile.ci.package."*"]
opt-level = 2
