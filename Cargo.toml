# This file should be copied to /home/yuvalif/lancedb/c/Cargo.toml

[package]
name = "lancedb-c"
version = "0.33.0"
edition = "2021"
description = "C bindings for LanceDB"
license = "Apache-2.0"
repository = "https://github.com/yuvalif/lancedb-c"
keywords = ["database", "vector", "search", "c", "ffi"]
categories = ["database", "api-bindings"]
rust-version = "1.91.0"

[lib]
name = "lancedb"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
tokio = { version = "1.23", features = ["rt-multi-thread"] }
libc = "0.2"
lancedb = { version = "0.33.0", features = ["remote"] }
lance = "=9.0.0"
lance-io = "=9.0.0"
lance-namespace = "=9.0.0"
arrow-array = "58.0"
arrow-data = "58.0"
arrow-schema = "58.0"
datafusion-common = "54"
datafusion-expr = "54"
datafusion-functions-json = "0.54"
datafusion-functions = { version = "54", default-features = false, features = ["string_expressions"] }
datafusion-functions-nested = "54"
datafusion-physical-expr = "54"
futures = "0"
chrono = "0"

[features]
# Exports C entry points used only by the C++ tests to exercise runtime failure paths
test-hooks = []
